<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinematics Equation Solver - Complete Module</title>
    
    <!-- KaTeX CSS & JS Engine -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            min-height: 98vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 36px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            text-align: center;
            max-width: 760px;
            width: 100%;
            border: 1px solid #e2e8f0;
        }

        h2 {
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .instructions {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 1.05rem;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Equation Box & Interactive Blocks */
        .equation-box {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 25px 0 35px 0;
            min-height: 140px;
            user-select: none;
            transition: transform 0.25s ease;
            font-size: 3.2rem;
        }

        .equation-box .katex {
            font-size: 3.2rem !important;
        }

        .side {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .equals {
            margin: 0 16px;
            font-size: 2.2rem;
            color: #334155;
        }

        .sign {
            margin: 0 10px;
            font-size: 2rem;
            color: #334155;
        }

        .var, .term-group, .side-clickable {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px dashed #cbd5e1;
            background-color: #f8fafc;
            margin: 0 4px;
            font-size: 2.2rem;
        }

        .var:hover:not(.static-term), .term-group:hover, .side-clickable:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        .selected {
            background-color: #4f46e5 !important;
            color: #ffffff !important;
            border: 2px solid #4338ca !important;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .selected .katex {
            color: #ffffff !important;
        }

        .static-term {
            cursor: default;
            border-style: solid;
        }

        /* Action Panel & Modular Toolkit */
        .action-panel {
            background-color: #f8fafc;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .action-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            margin-bottom: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Prevents uppercase CSS rule from changing math variable casing */
        .action-label .katex {
            text-transform: none !important;
            font-size: 1.15rem;
            color: #4f46e5;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            max-width: 440px;
            margin: 0 auto;
            width: 100%;
        }

        .full-width-row {
            grid-column: span 2;
        }

        .choices-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 540px;
        }

        /* Button Styling */
        button {
            padding: 10px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            border: 1.5px solid #cbd5e1;
            background-color: #ffffff;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:hover:not(:disabled) {
            background-color: #4f46e5;
            color: #ffffff;
            border-color: #4f46e5;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }

        button:disabled {
            border-color: #f1f5f9;
            background-color: #f8fafc;
            color: #cbd5e1;
            cursor: not-allowed;
        }

        .choices-container button {
            font-size: 1.15rem;
            padding: 12px 20px;
        }

        .choices-container button .katex {
            font-size: 1.25rem !important;
            margin-left: 0.35em;
        }

        /* Feedback Engine */
        #feedback {
            font-weight: 600;
            font-size: 0.95rem;
            min-height: 28px;
            margin-bottom: 10px;
            color: #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #feedback.success {
            color: #16a34a;
        }

        .shake {
            animation: shake 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .reset-btn {
            background: none;
            border: none;
            text-decoration: underline;
            color: #94a3b8;
            cursor: pointer;
            margin-top: 15px;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .reset-btn:hover {
            color: #475569;
            background: none;
            box-shadow: none;
        }
    </style>
</head><body><div class="container">
<h2>Kinematics Equation Solver</h2>
<p id="instruction-text" class="instructions">Choose the target variable you want to isolate.</p>
<div id="equation-container" class="equation-box"></div>
<div id="dynamic-panel" class="action-panel"></div>
<div id="feedback"></div>
<button class="reset-btn" onclick="resetToLanding()">Start Over</button></div>
<p><script>
    let currentMode = 'landing';
    let state = 0; 
    let selectedElementId = null;

    const feedback = document.getElementById('feedback');
    const panel = document.getElementById('dynamic-panel');
    const eqContainer = document.getElementById('equation-container');
    const instructionText = document.getElementById('instruction-text');

    // Helper to render KaTeX safely inside HTML templates
    function kRender(latex, sizeStyle = '') {
        try {
            const rendered = katex.renderToString(latex, { throwOnError: false });
            if (sizeStyle) {
                return `<span style="font-size: ${sizeStyle};">${rendered}</span>`;
            }
            return rendered;
        } catch (e) {
            return latex;
        }
    }

    // UI Renderers via KaTeX
    const txtV2Sq = () => kRender('v_2^2');
    const txtV2   = () => kRender('v_2');
    const txtV1Sq = () => kRender('v_1^2');
    const txtV1   = () => kRender('v_1');
    const txt2ad  = () => kRender('2ad');
    const txtA    = () => kRender('a');
    const txtD    = () => kRender('d');

    // Helper to identify active selection expression LaTeX for student reminder headers
    function getActiveSelectionKaTeX() {
        switch (selectedElementId) {
            case 'v2_sq':
                return txtV2Sq();
            case 'rhs_group':
                return kRender('v_1^2 + 2ad');
            case 'lhs_v1_inter':
                return kRender('v_2^2 - 2ad');
            case 'v1_sq_iso':
                return txtV1Sq();
            case 'lhs_ad_inter':
                return kRender('v_2^2 - v_1^2');
            case '2ad_iso':
                return txt2ad();
            default:
                return '';
        }
    }

    function render() {
        feedback.innerHTML = "";
        feedback.className = "";

        // LANDING DASHBOARD
        if (currentMode === 'landing') {
            instructionText.innerHTML = `Choose a variable to isolate from the baseline kinematics equation.`;
            eqContainer.innerHTML = kRender('v_2^2 = v_1^2 + 2ad', '3.2rem');
            panel.innerHTML = `
                <div class="choices-container">
                    <button onclick="startMode('v2')">Solve for&nbsp;${txtV2()}</button>
                    <button onclick="startMode('v1')">Solve for&nbsp;${txtV1()}</button>
                    <button onclick="startMode('a')">Solve for&nbsp;${txtA()}</button>
                    <button onclick="startMode('d')">Solve for&nbsp;${txtD()}</button>
                </div>`;
            return;
        }

        // --- GLOBAL EQUATION STATES ---
        if (state < 3) {
            eqContainer.innerHTML = `
                <div class="side"><span class="var ${selectedElementId === 'v2_sq' ? 'selected' : ''}" onclick="selectElement('v2_sq')">${txtV2Sq()}</span></div>
                <span class="equals">=</span>
                <div class="side">
                    <div id="rhs-box" class="term-group ${selectedElementId === 'rhs_group' ? 'selected' : ''}" onclick="selectElement('rhs_group')">
                        ${txtV1Sq()} <span class="sign" style="font-size:1.5rem; margin:0 6px;">+</span> ${txt2ad()}
                    </div>
                </div>`;
        } else if (state === 3 || state === 4 || state === 7) {
            if (currentMode === 'v1') {
                eqContainer.innerHTML = `
                    <div class="side-clickable ${selectedElementId === 'lhs_v1_inter' ? 'selected' : ''}" onclick="selectElement('lhs_v1_inter')">
                        ${txtV2Sq()} <span class="sign" style="font-size:1.5rem; margin:0 8px;">-</span> ${txt2ad()}
                    </div>
                    <span class="equals">=</span>
                    <div class="side"><span class="var ${selectedElementId === 'v1_sq_iso' ? 'selected' : ''}" onclick="selectElement('v1_sq_iso')">${txtV1Sq()}</span></div>`;
            } else {
                eqContainer.innerHTML = `
                    <div class="side-clickable ${selectedElementId === 'lhs_ad_inter' ? 'selected' : ''}" onclick="selectElement('lhs_ad_inter')">
                        ${txtV2Sq()} <span class="sign" style="font-size:1.5rem; margin:0 8px;">-</span> ${txtV1Sq()}
                    </div>
                    <span class="equals">=</span>
                    <div class="side"><span class="term-group ${selectedElementId === '2ad_iso' ? 'selected' : ''}" onclick="selectElement('2ad_iso')">${txt2ad()}</span></div>`;
            }
        } else if (state === 5 || state === 6) {
            if (currentMode === 'v2') {
                eqContainer.innerHTML = `
                    <div class="side"><span class="var static-term selected">${txtV2()}</span></div>
                    <span class="equals">=</span>
                    <div class="side">${kRender('\\sqrt{v_1^2 + 2ad}')}</div>`;
            } else if (currentMode === 'v1') {
                eqContainer.innerHTML = `
                    <div class="side">${kRender('\\sqrt{v_2^2 - 2ad}')}</div>
                    <span class="equals">=</span>
                    <div class="side"><span class="var static-term selected">${txtV1()}</span></div>`;
            } else if (state === 6) {
                eqContainer.innerHTML = `
                    <div class="side">${txtV2Sq()} <span class="sign" style="font-size:1.5rem; margin:0 8px;">-</span> ${txtV1Sq()}</div>
                    <span class="equals">=</span>
                    <div class="side"><span class="term-group ${selectedElementId === '2ad_iso' ? 'selected' : ''}" onclick="selectElement('2ad_iso')">${txt2ad()}</span></div>`;
            } else {
                let denom = currentMode === 'a' ? '2d' : '2a';
                let targetVarUI = currentMode === 'a' ? txtA() : txtD();
                eqContainer.innerHTML = `
                    <div class="side">${kRender('\\frac{v_2^2 - v_1^2}{' + denom + '}')}</div>
                    <span class="equals">=</span>
                    <div class="side"><span class="var static-term selected">${targetVarUI}</span></div>`;
            }
        }

        instructionText.innerHTML = `Rearrange the equation to isolate ${currentMode === 'v2' ? txtV2() : (currentMode === 'v1' ? txtV1() : (currentMode === 'a' ? txtA() : txtD()))}.`;
        renderActionPanels();
    }

    function renderActionPanels() {
        const activeExprKaTeX = getActiveSelectionKaTeX();
        const headerReminder = activeExprKaTeX ? `SELECT THE OPPOSITE OPERATION TO APPLY TO ${activeExprKaTeX}` : `SELECT AN OPERATION`;

        if (state === 0 || state === 3) {
            panel.innerHTML = `
                <div class="action-label">Select a variable or term in the equation above to work on</div>
                <div class="btn-grid">
                    <button disabled>Add</button>
                    <button disabled>Subtract</button>
                    <button disabled>Multiply</button>
                    <button disabled>Divide</button>
                    <button class="full-width-row" disabled>Take Square Root</button>
                </div>`;
        } 
        else if (state === 1) {
            panel.innerHTML = `
                <div class="action-label">What do you want to operate on within ${txtV1Sq()} + ${txt2ad()}?</div>
                <div class="choices-container">
                    <button onclick="handleSubmenuChoice('v1_sq')">${txtV1Sq()}</button>
                    <button onclick="handleSubmenuChoice('2')">${kRender('2')}</button>
                    <button onclick="handleSubmenuChoice('a')">${txtA()}</button>
                    <button onclick="handleSubmenuChoice('d')">${txtD()}</button>
                    <button onclick="handleSubmenuChoice('2ad')">${txt2ad()}</button>
                    ${currentMode === 'v2' ? `<button onclick="handleSubmenuChoice('all')">${kRender('v_1^2 + 2ad')}</button>` : ''}
                </div>`;
        } 
        else if (state === 2 || state === 7) {
            panel.innerHTML = `
                <div class="action-label">${headerReminder}</div>
                <div class="btn-grid">
                    <button onclick="handleOpClick('add')">Add</button>
                    <button onclick="handleOpClick('subtract')">Subtract</button>
                    <button onclick="handleOpClick('multiply')">Multiply</button>
                    <button onclick="handleOpClick('divide')">Divide</button>
                    <button class="full-width-row" onclick="handleOpClick('root')">Take Square Root</button>
                </div>`;
        } 
        else if (state === 4) {
            if (currentMode === 'v1' || selectedElementId === 'lhs_v1_inter') {
                panel.innerHTML = `
                    <div class="action-label">${headerReminder}</div>
                    <div class="btn-grid">
                        <button onclick="handleOpClick('add')">Add</button>
                        <button onclick="handleOpClick('subtract')">Subtract</button>
                        <button onclick="handleOpClick('multiply')">Multiply</button>
                        <button onclick="handleOpClick('divide')">Divide</button>
                        <button class="full-width-row" onclick="handleOpClick('root')">Take Square Root</button>
                    </div>`;
            } else {
                let compositeFactorText = currentMode === 'a' ? '2d' : '2a';
                panel.innerHTML = `
                    <div class="action-label">What do you want to operate on within ${txt2ad()}?</div>
                    <div class="choices-container">
                        <button onclick="showError('We can\\'t leave parts of the unwanted factor behind.')">${kRender('2')}</button>
                        <button onclick="showError('We want to keep our target variable right here.')">${currentMode === 'a' ? txtA() : txtD()}</button>
                        <button onclick="showError('We can\\'t leave parts of the unwanted factor behind.')">${currentMode === 'a' ? txtD() : txtA()}</button>
                        <button onclick="advanceState(6)">${kRender(compositeFactorText)}</button>
                    </div>`;
            }
        } 
        else if (state === 6) {
            panel.innerHTML = `
                <div class="action-label">SELECT THE OPPOSITE OPERATION TO APPLY TO ${kRender(currentMode === 'a' ? '2d' : '2a')}</div>
                <div class="btn-grid">
                    <button onclick="showError('Select the opposite operation.')">Add</button>
                    <button onclick="showError('Select the opposite operation.')">Subtract</button>
                    <button onclick="showError('Select the opposite operation.')">Multiply</button>
                    <button onclick="advanceState(5)">Divide</button>
                    <button class="full-width-row" onclick="showError('Select the opposite operation.')">Take Square Root</button>
                </div>`;
        } 
        else if (state === 5) {
            let finalVarUI = currentMode === 'v2' ? txtV2() : (currentMode === 'v1' ? txtV1() : (currentMode === 'a' ? txtA() : txtD()));
            panel.innerHTML = `<div class="action-label" style="color: #16a34a;">EQUATION SOLVED!</div>`;
            feedback.innerHTML = `Success! You've isolated ${finalVarUI}.`;
            feedback.className = "success";
        }
    }

    // --- SELECTION ENGINE & ROUTING LOGIC ---
    function selectElement(id) {
        if (state === 5) return;
        selectedElementId = id;

        if (state < 3) {
            if (id === 'v2_sq') {
                state = 2; render();
            } else if (id === 'rhs_group') {
                state = 1; render();
            }
        } else {
            if (currentMode === 'v1') {
                if (id === 'v1_sq_iso') { state = 4; render(); }
                else { selectedElementId = 'lhs_v1_inter'; state = 4; render(); }
            } else {
                if (id === '2ad_iso') { state = 4; render(); }
                else { selectedElementId = 'lhs_ad_inter'; state = 7; render(); }
            }
        }
    }

    function handleSubmenuChoice(choice) {
        if (currentMode === 'v2') {
            if (choice === 'all') { advanceState(2); } 
            else { showError("There's nothing we can do with just that."); }
        } 
        else if (currentMode === 'v1') {
            if (choice === '2ad') { advanceState(2); }
            else if (choice === 'v1_sq') { showError("We want to keep our target variable right here."); }
            else { showError("We can't move a factor if there is more than one term."); }
        } 
        else if (currentMode === 'a' || currentMode === 'd') {
            if (choice === 'v1_sq') { advanceState(2); }
            else if (choice === '2ad' || choice === '2' || choice === 'a' || choice === 'd') {
                showError(choice === '2ad' || choice === currentMode ? "We want to leave the term containing our target variable where it is." : "We can't move a factor if there is more than one term.");
            }
        }
    }

    function handleOpClick(op) {
        // Left hand side interactions from start state
        if (selectedElementId === 'v2_sq') {
            if (op === 'root') {
                if (currentMode === 'v2') { advanceState(5); } 
                else { showError("Taking the square root now pulls the right-hand side under a radical, making it much harder to isolate your target variable. Move the independent terms first."); }
            } else { showError("Select the opposite operation."); }
            return;
        }

        // Left hand side or isolated configurations in intermediate state 
        if (selectedElementId === 'lhs_v1_inter' || selectedElementId === 'v1_sq_iso') {
            if (op === 'root') { advanceState(5); } 
            else { showError("Select the opposite operation."); }
            return;
        }

        if (selectedElementId === 'lhs_ad_inter') {
            if (op === 'root') { showError("Taking the square root now will trap your linear variables inside a radical, moving you further away from isolating your target."); }
            else { showError("Select the opposite operation."); }
            return;
        }

        // Standard RHS derivations
        if (op === 'subtract') {
            if (currentMode === 'v1' || currentMode === 'a' || currentMode === 'd') { advanceState(3); } 
            else { showError("Select the opposite operation."); }
        } else if (op === 'root') {
            if (currentMode === 'v2') { advanceState(5); } 
            else { showError("Taking the square root of this single term won't help clear it from this side."); }
        } else {
            showError("Select the opposite operation.");
        }
    }

    function advanceState(nextState) {
        state = nextState;
        if (state === 3 || state === 5) selectedElementId = null;
        render();
    }

    function startMode(mode) {
        currentMode = mode;
        state = 0;
        selectedElementId = null;
        render();
    }

    function showError(msg) {
        feedback.innerHTML = msg;
        feedback.className = "";
        feedback.classList.remove('shake');
        void feedback.offsetWidth; 
        feedback.classList.add('shake');
    }

    function resetToLanding() {
        currentMode = 'landing';
        state = 0;
        selectedElementId = null;
        render();
    }

    render();
</script></p></body></html>
